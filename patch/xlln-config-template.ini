#--- XLiveLessNess Configuration File ---

# xlln_debug_log_trace_blacklist:
# A comma separated list of trace function names to ignore in the logging to reduce spam.

# xlln_debug_log_level:
# Saves the log level from last use (stored in Hexadecimal).
# DEFAULT value: 0x873F.
# Binary to Hexadecimal:
# 0b1000011100111111 == 0x873F.
# 0bO0000MXG00FEWIDT - Bit Mask Legend.
# Context Options:
# - O - Other - Logs related to functionality from other areas of the application.
# - M - XLLN-Module - Logs related to XLLN-Module functionality.
# - X - XLiveLessNess - Logs related to XLiveLessNess functionality.
# - G - XLive - Logs related to XLive(GFWL) functionality.
# Log Level Options:
# - F - Fatal - Errors that will terminate the application.
# - E - Error - Any error which is fatal to the operation, but not the service or application (can't open a required file, missing data, etc.).
# - W - Warning - Anything that can potentially cause application oddities, but is being handled adequately.
# - I - Info - Generally useful information to log (service start/stop, configuration assumptions, etc).
# - D - Debug - Function, variable and operation logging.
# - T - Trace - Function call tracing.

# xlive_hotkey_id_guide:
# Valid values: 0x0 to 0xFFFF.
#   0x0 - Turns off the hotkey.
#   0x24 - (DEFAULT) - VK_HOME
# This hotkey will open the Guide menu when pressed on (usually) the active Title screen/window.
# If the Title does not use Direct3D (such as in dedicated servers) then the Guide hotkey will not work.
# The following link documents the keyboard Virtual-Key (VK) codes available for use:
# https://docs.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes

# xlive_fps_limit:
# Valid values: 0 to (2^32 - 1).
#   0 - Disables the built in limiter.
#   60 - (DEFAULT)
# The frequency (times per second) that XLiveRender is permitted to execute.
# XLiveRender is typically used in Title render loops so this value can be considered as an FPS limit.

# xlln_network_instance_base_port:
# Valid values: 1 to 65535.
#   39000 - (DEFAULT).
# The shared port between all local XLLN instances used for broadcasting/communicating available lobbies/games/matches.
# This port also serves as the base port used to calculate the default xlln_network_instance_port value if it has not already been explicitly defined.

# xlln_network_instance_port:
# Valid values: 0 to 65535.
#   0 - Disables ALL network access (the Title will still think it has network access when it actually does not).
#   xlln_network_instance_base_port + X - (DEFAULT) X is the Local Instance ID (usually 1).

# xlive_net_disable:
# Valid values:
#   0 - (DEFAULT) All network functionality related to xlive functions is enabled.
#   1 - All network functionality related to xlive functions is disabled.
# Allows turning off xlive network functionality.

# xlive_xhv_engine_enabled:
# Valid values:
#   0 - (DEFAULT) The XHV Engine will not run.
#   1 - The XHV Engine is enabled for use.
# Allows activating the XHV Engine which is used for voice chat.

# xlive_xhv_engine_voice_encoded_bitrate:
# The bitrate per second of voice data to be sent over the network per local speaker. Note that this will not affect other player's voice quality. Set this too high and all the voice data you send may not make it to the other players.

# xlive_specific_network_adapter:
# Example value: {XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX}
# The network adapter to only use if it is available. If it is not available or this setting is blank then all network adapters will be used.

# xlive_ignore_title_network_adapter:
# Valid values:
#   0 - Limits XLLN to only that network adapter when broadcasting and searching for available games.
#   1 - (DEFAULT) Ignores setting a specific network adapter from the Title.
# On startup in XLiveInitialize(...) the title specifies a specific network adapter to use (if any). This setting can prevent that from happening.

# xlive_broadcast_address:
# A comma separated list of network addresses to send broadcast packets to.
# All addresses are comma (,) separated. Do not use spaces at all.
# The IP and corresponding Port are (and must be to be considered valid) separated with a colon ':'. Since IPv6 uses colons in its format, IPv6 addresses need to be enclosed in square brackets '[' and ']'.
# If an IP address is specified with port number 0, it will use the value of xlln_network_instance_base_port as the port to broadcast/send to.
# If the network address is specified of a local subnet, it will actually prevent automatic broadcasting to that subnet specifically. If an IP on the subnet is specified then only that address in that subnet will receive broadcasts.
# So an example of a comma separated list of a domain name, IPv4 (local address broadcast) and an IPv6 address is as follows:
# glitchyscripts.com:1100,127.0.0.0:0,192.168.0.255:0,[2001:0db8:85a3:0000:0000:8a2e:0370:7334]:39000

# xlln_direct_ip_connect_password:
# The last used password used to host or connect with via Direct IP.

# xlln_direct_ip_connect_ip_port:
# The saved IP address and Port of a lobby to connect to.
# The IP and Port are separated with a colon ':'. Since IPv6 uses colons in its format, IPv6 addresses need to be enclosed in square brackets '[' and ']'.

# xlive_locale:
# Valid values:
#    1 - English
#    2 - Japanese
#    3 - German
#    4 - French
#    5 - Spanish
#    6 - Italian
#    7 - Korean
#    8 - Traditional Chinese
#    9 - Portuguese
#   10 - Simplified Chinese
#   11 - Polish
#   12 - Russian

# xlive_username_p1...:
# Max username length is 15 characters.
# The username for each local profile to use.
# This option does not apply when logging in from XLLN-Modules via XLLNLogin(...).

# xlive_user_live_enabled_p1...:
# Valid values:
#   0 - The user will be signed in to a local offline account.
#   1 - The user will be signed in to an online LIVE account.
# This option does not apply when logging in from XLLN-Modules via XLLNLogin(...).
# This option assumes xlive_user_online_enabled_p? is also disabled if this is too (and will set it so).

# xlive_user_online_enabled_p1...:
# Valid values:
#   0 - The user will be signed in as 'Offline' on a LIVE account.
#   1 - The user will be signed in as 'Online' on a LIVE account.
# This option does not apply when logging in from XLLN-Modules via XLLNLogin(...).
# This option assumes xlive_user_live_enabled_p? is also enabled if this is too (and will set it so).

# xlive_user_auto_login_p1...:
# Valid values:
#   0 - Do not sign in automatically.
#   1 - Auto sign in.
# Whether the user will be automatically signed in when the Title calls XShowSigninUI(...) and there are no other users already logged in.
# This option does not apply when logging in from XLLN-Modules via XLLNLogin(...).

# xlive_user_audio_input_device_name_p1...:
# The name of the audio input device used as the microphone for voice chat.
# Leaving this blank is to disable the microphone.

# xlive_user_audio_input_device_volume_p1...:
# Valid values: 0 to 1000.
#   100 - (DEFAULT)
# This can be used to reduce or increase the loudness of the captured audio from the microphone that others can hear in voice chat.

# xlive_user_audio_input_device_threshold_p1...:
# Valid values: 0 to 100.
#   0   - Always capturing audio.
#   10  - (DEFAULT) fairly sensitive.
#   100 - About impossible to capture audio.
# This is used to change the microphone volume activation sensitivity in voice chat.

# xlive_user_audio_output_device_name_p1...:
# The name of the audio input device used as the playback speaker for voice chat.
# Leaving this blank will prevent you from being able to hear anyone.

# xlive_user_audio_output_device_volume_p1...:
# Valid values: 0 to 100.
#   100 - (DEFAULT)
# This can be used to reduce the loudness all other players on voice chat.

# xlive_user_voice_remote_volume_p1...:
# Comma separated list with items in the form of XUID:VOLUME.
# Example item 0x0009000000000000:100.
# XUID formatted as padded 64 bit value in hexadecimal. It however cannot be of value 0.
# Valid VOLUME values: 0 to 1000.
#   :100 - (DEFAULT)
# This can be used to reduce the loudness or mute a specific player in voice chat.


